name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pyvista/setup-headless-display-action@v3
      - name: Install
        # Homebrew no longer has hdf4 and the newest pyhdf wheel needs macOS 26, so pip takes the newest pyhdf that has a wheel
        run: python -m pip install --prefer-binary ".[test,all]"
      - name: Test installed package (offline tests)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t" && cp -r tests "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t" && python -m pytest -q tests
      - name: Tests that need the source tree (authorship, GCS fit files)
        run: python -m pytest -q tests/test_authorship.py tests/test_gcs_fit.py
