name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pyvista/setup-headless-display-action@v3
      - name: HDF4 library for pyhdf (macOS has no pyhdf wheel for every runner)
        if: runner.os == 'macOS'
        run: brew install hdf4
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test installed package (offline tests)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t" && cp -r tests "$RUNNER_TEMP/t/"
          cd "$RUNNER_TEMP/t" && python -m pytest -q tests
      - name: Authorship tests (need the source tree)
        run: python -m pytest -q tests/test_authorship.py
