name: Problem or wrong result
description: Something does not work, crashes, or gives a result you think is wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for testing corona3d. The more exact the steps, the faster the problem can be fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, with their options, and any keys you changed in config.json.
      placeholder: "corona3d render --c2 --cor1 --cor2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: corona3d version, Python version and operating system
      placeholder: "0.0.1 (corona3d --version), Python 3.12, Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or terminal output
