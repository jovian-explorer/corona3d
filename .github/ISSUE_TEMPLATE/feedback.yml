name: Feedback or suggestion
description: Comments on the scene, the layers, other events or models, documentation
labels: [feedback]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your comments
      description: What did you try to do, what helped, what got in the way, what is missing?
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Your field and the data you work with (optional)
      placeholder: "e.g. type II bursts, CME shocks, coronal modelling"
